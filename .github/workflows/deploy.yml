name: Deploiement production

# Chaque push sur main met richardsalanon.com a jour.
# "workflow_dispatch" permet de relancer un deploiement a la main depuis
# l'onglet Actions, sans avoir a faire un commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul deploiement a la fois : deux rsync simultanes laisseraient le
# serveur dans un etat incoherent. cancel-in-progress reste a false,
# on ne coupe jamais un transfert deja commence.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          # Historique complet : necessaire pour dater chaque fichier.
          fetch-depth: 0

      # Dates reelles des fichiers (03/10/2026). Le checkout date tous les
      # fichiers du jour du deploiement ; le sitemap lisait ces dates et 89
      # URL sur 120 annoncaient un faux lastmod. git restore-mtime remet
      # sur chaque fichier la date de son dernier commit ; rsync -t la conserve.
      - name: Restaurer les dates des fichiers depuis git
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-restore-mtime
          git restore-mtime

      - name: Charger la cle SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Diagnostic : Hostinger filtre parfois les connexions SSH entrantes.
      # Le port doit repondre depuis le runner GitHub, pas seulement depuis
      # votre machine. On le verifie explicitement avant d'aller plus loin.
      - name: Verifier que le port SSH repond
        run: |
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.SSH_HOST }}/${{ secrets.SSH_PORT }}" 2>/dev/null; then
            echo "Port SSH joignable depuis GitHub Actions."
          else
            echo "ECHEC : le port SSH ne repond pas depuis ce runner."
            echo "Cause la plus probable : le pare-feu Hostinger n'autorise pas"
            echo "les adresses IP de GitHub Actions. Voir hPanel > Avance >"
            echo "Acces SSH, ou la section pare-feu / IP autorisees."
            exit 1
          fi

      - name: Enregistrer l'empreinte du serveur
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if ssh-keyscan -T 20 -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>keyscan.err; then
            echo "Empreinte du serveur enregistree."
          else
            echo "ssh-keyscan a echoue :"
            cat keyscan.err
            echo "Repli sur accept-new : l'empreinte sera acceptee a la premiere connexion."
          fi
          chmod 600 ~/.ssh/known_hosts 2>/dev/null || true

      # Simulation d'abord : le journal montre exactement ce qui sera
      # envoye ET supprime, avant que quoi que ce soit ne bouge.
      # A relire au moindre doute apres un changement du .deployignore.
      - name: Simulation (aucune modification)
        run: |
          rsync -rlzt --delete --dry-run --itemize-changes \
            --exclude-from=.deployignore \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}" \
            | tee simulation.txt
          echo "--- Suppressions prevues ---"
          grep '^\*deleting' simulation.txt || echo "aucune"

      - name: Deploiement
        run: |
          rsync -rlzt --delete --itemize-changes \
            --exclude-from=.deployignore \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}"

      # Migrations de base — AVANT la regeneration du sitemap et le controle
      # HTTP, car le code qui vient d'etre envoye peut dependre de colonnes
      # que ces migrations creent. Jusqu'ici elles se collaient a la main dans
      # phpMyAdmin : une etape oubliee et le site reference des colonnes
      # inexistantes.
      #
      # migrate.php n'applique que les fichiers absents de schema_migrations
      # et les enregistre : rejouer un deploiement ne touche a rien. Si une
      # migration echoue, elle n'est PAS enregistree, le job s'arrete ici et
      # le controle HTTP qui suit ne masquera pas le probleme.
      - name: Appliquer les migrations de base
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -o StrictHostKeyChecking=accept-new \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd '${{ secrets.SSH_PATH }}' && php migrate.php"

      # Le sitemap est un fichier STATIQUE genere depuis la base. Sans cette
      # etape il reste fige : le 20/08/2026, 4 URL du sitemap pointaient
      # encore vers d'anciens slugs et repondaient 301 au lieu de 200.
      - name: Regenerer le sitemap
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://richardsalanon.com/generate-sitemap.php?key=${{ secrets.SITEMAP_KEY }}"

      # Signaler les URL a IndexNow (01/09/2026). Concerne Bing, Yandex,
      # Seznam et Naver, PAS Google, qui a retire son point de ping en
      # juin 2023 et ne decouvre plus que par crawl et sitemap.
      # La cle est le fichier public a7f3c9e...txt deja servi a la racine.
      - name: Signaler les URL a IndexNow
        continue-on-error: true
        run: |
          cle=a7f3c9e21b6d4f08a5c2e9d7b4f16a83
          curl --silent --show-error --max-time 60 \
            "https://richardsalanon.com/sitemap.xml" \
            | grep -o '<loc>[^<]*' | sed 's/<loc>//' > urls.txt
          echo "URL a signaler : $(wc -l < urls.txt)"
          python3 - "$cle" < urls.txt > payload.json <<'PY'
          import sys, json
          urls = [l.strip() for l in sys.stdin if l.strip()]
          print(json.dumps({
              "host": "richardsalanon.com",
              "key": sys.argv[1],
              "keyLocation": "https://richardsalanon.com/%s.txt" % sys.argv[1],
              "urlList": urls[:10000],
          }))
          PY
          code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 60 \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data @payload.json https://api.indexnow.org/IndexNow)
          echo "IndexNow : HTTP $code (200 ou 202 = accepte)"

      # Filet de securite : si l'accueil ne repond plus 200 apres le
      # deploiement, le job echoue et vous etes notifie.
      - name: Verifier que le site repond
        run: |
          code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 https://richardsalanon.com/)
          echo "Page d'accueil : HTTP $code"
          test "$code" = "200"

      # Controle de fumee (03/10/2026) : redirections, robots, llms, sitemap,
      # graphe JSON-LD. Signale sans bloquer : le site est deja en ligne.
      - name: Controle de fumee
        continue-on-error: true
        run: php tools/qa/smoke.php https://richardsalanon.com
