name: Deploiement production

# Chaque push sur main met richard.salanon.info a jour.
# "workflow_dispatch" permet de relancer un deploiement a la main depuis
# l'onglet Actions, sans avoir a faire un commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Un seul deploiement a la fois : deux rsync simultanes laisseraient le
# serveur dans un etat incoherent. cancel-in-progress reste a false,
# on ne coupe jamais un transfert deja commence.
concurrency:
  group: deploiement-production
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Charger la cle SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      # Diagnostic : Hostinger filtre parfois les connexions SSH entrantes.
      # Le port doit repondre depuis le runner GitHub, pas seulement depuis
      # votre machine. On le verifie explicitement avant d'aller plus loin.
      - name: Verifier que le port SSH repond
        run: |
          if timeout 15 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.SSH_HOST }}/${{ secrets.SSH_PORT }}" 2>/dev/null; then
            echo "Port SSH joignable depuis GitHub Actions."
          else
            echo "ECHEC : le port SSH ne repond pas depuis ce runner."
            echo "Cause la plus probable : le pare-feu Hostinger n'autorise pas"
            echo "les adresses IP de GitHub Actions. Voir hPanel > Avance >"
            echo "Acces SSH, ou la section pare-feu / IP autorisees."
            exit 1
          fi

      - name: Enregistrer l'empreinte du serveur
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          if ssh-keyscan -T 20 -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>keyscan.err; then
            echo "Empreinte du serveur enregistree."
          else
            echo "ssh-keyscan a echoue :"
            cat keyscan.err
            echo "Repli sur accept-new : l'empreinte sera acceptee a la premiere connexion."
          fi
          chmod 600 ~/.ssh/known_hosts 2>/dev/null || true

      # Simulation d'abord : le journal montre exactement ce qui sera
      # envoye ET supprime, avant que quoi que ce soit ne bouge.
      # A relire au moindre doute apres un changement du .deployignore.
      - name: Simulation (aucune modification)
        run: |
          rsync -rlz --delete --dry-run --itemize-changes \
            --exclude-from=.deployignore \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}" \
            | tee simulation.txt
          echo "--- Suppressions prevues ---"
          grep '^\*deleting' simulation.txt || echo "aucune"

      - name: Deploiement
        run: |
          rsync -rlz --delete --itemize-changes \
            --exclude-from=.deployignore \
            -e "ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH }}"

      # Le sitemap est un fichier STATIQUE genere depuis la base. Sans cette
      # etape il reste fige : le 20/08/2026, 4 URL du sitemap pointaient
      # encore vers d'anciens slugs et repondaient 301 au lieu de 200.
      - name: Regenerer le sitemap
        run: |
          curl --fail --silent --show-error --max-time 60 \
            "https://richard.salanon.info/generate-sitemap.php?key=${{ secrets.SITEMAP_KEY }}"

      # Filet de securite : si l'accueil ne repond plus 200 apres le
      # deploiement, le job echoue et vous etes notifie.
      - name: Verifier que le site repond
        run: |
          code=$(curl -o /dev/null -s -w "%{http_code}" --max-time 30 https://richard.salanon.info/)
          echo "Page d'accueil : HTTP $code"
          test "$code" = "200"
