<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 232 48" width="232" height="48" role="img" aria-label="Richard SALANON">
<title>Richard SALANON</title>
<!-- Logo provisoire. Police : sous-ensemble de Sora (SIL OFL 1.1) embarqué, repli sur Sora puis Arial. -->
<style>
@font-face{font-family:"RS Logo Sora";font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
@font-face{font-family:"RS Logo Sora";font-style:normal;font-weight:700;src:url(data:font/woff2;base64,) format("woff2")}
</style>
<rect x="0" y="4" width="40" height="40" rx="10" fill="#FFFFFF"/>
<text x="20" y="30.9" font-family="'RS Logo Sora', Sora, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle" fill="#14161F">RS</text>
<circle cx="34" cy="38" r="2.75" fill="#C2502F"/>
<text x="52" y="30.6" font-family="'RS Logo Sora', Sora, Arial, sans-serif" font-size="18" fill="#FFFFFF"><tspan font-weight="500">Richard</tspan> <tspan font-weight="700" letter-spacing=".04em">SALANON</tspan></text>
</svg>
