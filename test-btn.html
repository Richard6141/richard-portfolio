<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Test bouton</title></head>
<body style="padding:2rem;font-family:system-ui">

<p id="p1" style="display:none;background:#eee;padding:1rem;margin:1rem 0">Contenu cache 1</p>
<p id="p2" style="display:none;background:#eee;padding:1rem;margin:1rem 0">Contenu cache 2</p>

<button data-showmore-btn="test" style="padding:12px 24px;border-radius:999px;border:1px solid #ccc;background:#fff;color:#2563eb;font-size:14px;font-weight:600;cursor:pointer">
    <span>Voir plus</span>
    <svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
</button>

<p id="log" style="margin-top:2rem;color:gray;font-size:12px"></p>

<script>
document.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-showmore-btn]');
    document.getElementById('log').textContent += 'click target=' + e.target.tagName + ' btn=' + (btn ? 'FOUND' : 'null') + ' | ';
    if (btn) {
        document.getElementById('p1').style.display = document.getElementById('p1').style.display === 'none' ? '' : 'none';
        document.getElementById('p2').style.display = document.getElementById('p2').style.display === 'none' ? '' : 'none';
    }
});
</script>

</body>
</html>
